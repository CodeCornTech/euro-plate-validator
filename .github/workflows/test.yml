name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Moldova regression tests
        run: npm run test:moldova

      - name: Release CLI contract and shared UI
        run: |
          bash -n scripts/sh/make_release.sh scripts/lib/cc-ui.sh
          node --check scripts/lib/cc-ui-node.mjs
          node scripts/sh/test-release-contract.mjs

      - name: CLI smoke test
        run: node ./bin/cli.mjs "AB 123 CD" --countries IT --type car --pretty
